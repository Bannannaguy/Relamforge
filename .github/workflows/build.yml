name: Build and Release Executables

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script-name: main.py
          - os: ubuntu-latest
            script-name: main.py
          - os: macos-latest
            script-name: main.py

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build Executable
        run: python -m PyInstaller --onefile ${{ matrix.script-name }}

      - name: Upload Artifacts to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
