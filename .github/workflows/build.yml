name: Build and Release Executables

on:
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            binary-name: Realmforge-Windows
          - os: ubuntu-latest
            binary-name: Realmforge-Linux
          - os: macos-latest
            binary-name: Realmforge-macOS

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller pygame

      - name: Build Executable
        shell: bash
        run: |
          python -m PyInstaller --onefile --name "${{ matrix.binary-name }}" main.py

      - name: Upload Artifacts to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.binary-name }}*
